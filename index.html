
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPredict AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5fb;
  color: #24324b;
}
header {
  background: #173b70;
  color: white;
  padding: 25px;
  text-align: center;
}
header h1 { margin: 0; }
header p { margin-bottom: 0; }
main {
  max-width: 1100px;
  margin: 30px auto;
  padding: 15px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 15px;
}
.stat, .panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0001;
}
.stat strong {
  display: block;
  font-size: 28px;
  color: #2464ae;
}
.panel { margin-top: 22px; }
input {
  padding: 12px;
  margin: 5px;
  border: 1px solid #ccd5e2;
  border-radius: 7px;
  max-width: 100%;
}
button {
  background: #2464ae;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 12px 18px;
  cursor: pointer;
}
button:hover { background: #173b70; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid #e5eaf1;
  text-align: left;
}
th { background: #eaf1fa; }
.aprobado { color: #16834a; font-weight: bold; }
.extra { color: #c07813; font-weight: bold; }
.baja { color: #bb3434; font-weight: bold; }
.table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<header>
<h1>EduPredict AI</h1>
<p>Sistema inteligente de gestión académica</p>
</header>

<main>
<section class="stats">
<div class="stat">Total de alumnos<strong id="total">0</strong></div>
<div class="stat">Aprobados<strong id="aprobados">0</strong></div>
<div class="stat">Extraordinarios<strong id="extra">0</strong></div>
<div class="stat">Promedio general<strong id="general">0.00</strong></div>
</section>

<section class="panel">
<h2>Registrar alumno</h2>
<input id="nombre" placeholder="Nombre completo">
<input id="grupo" placeholder="Grupo">
<input id="p1" type="number" min="0" max="10" step="0.1" placeholder="Parcial 1">
<input id="p2" type="number" min="0" max="10" step="0.1" placeholder="Parcial 2">
<input id="p3" type="number" min="0" max="10" step="0.1" placeholder="Parcial 3">
<button onclick="agregarAlumno()">Registrar alumno</button>
<p id="mensaje" aria-live="polite"></p>
</section>

<section class="panel">
<h2>Base de datos académica</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Alumno</th><th>Grupo</th>
<th>P1</th><th>P2</th><th>P3</th>
<th>Promedio</th><th>Estado</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>
</section>
</main>

<script>
let alumnos = [];

function agregarAlumno() {
  const nombre = document.getElementById("nombre").value.trim();
  const grupo = document.getElementById("grupo").value.trim();
  const p1 = Number(document.getElementById("p1").value);
  const p2 = Number(document.getElementById("p2").value);
  const p3 = Number(document.getElementById("p3").value);

  if (!nombre || !grupo ||
      ["p1","p2","p3"].some(id => document.getElementById(id).value === "") ||
      [p1,p2,p3].some(n => !Number.isFinite(n) || n < 0 || n > 10)) {
    document.getElementById("mensaje").textContent =
      "Completa todos los campos y usa calificaciones de 0 a 10.";
    return;
  }

  const promedio = (p1+p2+p3)/3;
  const estado = promedio >= 6 ? "Aprobado" : "Extraordinario";

  alumnos.push({nombre, grupo, p1, p2, p3, promedio, estado});
  actualizarTabla();

  document.getElementById("mensaje").textContent =
    "Alumno registrado correctamente.";

  ["nombre","grupo","p1","p2","p3"].forEach(id =>
    document.getElementById(id).value = ""
  );
}

function actualizarTabla() {
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  alumnos.forEach(a => {
    const fila = document.createElement("tr");
    [a.nombre,a.grupo,a.p1,a.p2,a.p3,a.promedio.toFixed(2),a.estado]
      .forEach((valor,i) => {
        const celda = document.createElement("td");
        celda.textContent = valor;
        if (i === 6) {
          celda.className = a.estado === "Aprobado" ? "aprobado" : "extra";
        }
        fila.appendChild(celda);
      });
    tabla.appendChild(fila);
  });

  document.getElementById("total").textContent = alumnos.length;
  document.getElementById("aprobados").textContent =
    alumnos.filter(a => a.estado === "Aprobado").length;
  document.getElementById("extra").textContent =
    alumnos.filter(a => a.estado === "Extraordinario").length;

  const promedioGeneral = alumnos.length
    ? alumnos.reduce((s,a) => s+a.promedio,0)/alumnos.length : 0;
  document.getElementById("general").textContent =
    promedioGeneral.toFixed(2);
}
</script>

</body>
</html>
